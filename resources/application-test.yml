spring:
  datasource:
    url: jdbc:h2:mem:abilitybridge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: TestSecretKey2024-AbilityBridge-MustBe256BitsLongForTests!
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  frontend-url: http://localhost:3000
