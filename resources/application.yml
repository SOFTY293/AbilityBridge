spring:
  application:
    name: abilitybridge-backend
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/abilitybridge
    username: ${DB_USERNAME:abilitybridge}
    password: ${DB_PASSWORD:abilitybridge}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=your-email@gmail.com
    spring.mail.password=your-app-password
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

# ── JWT ──────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:AbilityBridgeSecretKey2024-ChangeInProductionMustBe256BitsLong!}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:uploads}

# ── Springdoc / Swagger ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: AbilityBridge API
    version: 1.0.0
    description: Inclusive employment platform REST API

# ── Logging ─────────────────────────────────────────────────────
logging:
  level:
    com.abilitybridge: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO